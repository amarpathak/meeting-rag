services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-mi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mi}
      POSTGRES_DB: ${POSTGRES_DB:-meeting_intel}
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mi} -d ${POSTGRES_DB:-meeting_intel}"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: ./api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-mi}:${POSTGRES_PASSWORD:-mi}@db:5432/${POSTGRES_DB:-meeting_intel}
    ports:
      - "8000:8000"
    volumes:
      - ./api:/app
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
